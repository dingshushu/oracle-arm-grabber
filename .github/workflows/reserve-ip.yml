name: OCI Reserve IP

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'plan=盘点只读; apply=执行转换(临时IP->保留IP)'
        type: choice
        options:
          - plan
          - apply
        required: true
      old_ip:
        description: 'apply时必填: 当前公网IP'
        required: false
        default: ''
      reserved_name:
        description: '保留IP显示名(apply用)'
        required: false
        default: 'reserved-ip'

permissions:
  contents: write

jobs:
  reserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: pip install --quiet oci

      - name: Write OCI config & key
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p $HOME/.oci
          printf '%s\n' "$OCI_KEY" > $HOME/oci_key.pem
          chmod 600 $HOME/oci_key.pem
          printf '%s\n' "$OCI_CONFIG" > $HOME/.oci/config

      - name: Run reserve tool
        env:
          ACTION: ${{ inputs.action }}
          OLD_IP: ${{ inputs.old_ip }}
          RESERVED_NAME: ${{ inputs.reserved_name }}
        run: |
          python3 - <<'PYEOF' 2>&1 | tee /tmp/result.txt
          import json, os, sys, time, traceback
          import oci

          ACTION = os.environ.get('ACTION', '').strip()
          OLD_IP = os.environ.get('OLD_IP', '').strip()
          R_NAME = (os.environ.get('RESERVED_NAME', '').strip() or 'reserved-ip')

          cfg = oci.config.from_file()
          net = oci.core.VirtualNetworkClient(cfg)
          comp = oci.core.ComputeClient(cfg)
          tenancy = cfg['tenancy']
          print('TENANCY:', tenancy)
          print('ACTION=%s OLD_IP=%s NAME=%s' % (ACTION, OLD_IP or '-', R_NAME))

          def all_pages(fn, **kw):
              return oci.pagination.list_call_get_all_results(fn, **kw).data

          def safe(fn, *a, **kw):
              try:
                  return fn(*a, **kw), None
              except oci.exceptions.ServiceError as e:
                  return None, 'ServiceError %s %s' % (e.status, e.message)
              except Exception as e:
                  return None, repr(e)

          def pub_by_addr(a):
              return net.get_public_ip_by_ip_address(
                  oci.core.models.GetPublicIpByIpAddressDetails(ip_address=a)).data

          def pub_by_priv(pid):
              return net.get_public_ip_by_private_ip_id(
                  oci.core.models.GetPublicIpByPrivateIpIdDetails(private_ip_id=pid)).data

          def fmt(pb):
              return '%s lifetime=%s state=%s id=%s priv=%s' % (
                  pb.ip_address, pb.lifetime, pb.lifecycle_state, pb.id, pb.private_ip_id)

          if ACTION == 'plan':
              insts = all_pages(comp.list_instances, compartment_id=tenancy)
              print('INSTANCES:', len(insts))
              for inst in insts:
                  print('--- %s | %s | %s' % (inst.display_name, inst.lifecycle_state, inst.id))
                  atts, e = safe(all_pages, comp.list_vnic_attachments, compartment_id=tenancy, instance_id=inst.id)
                  if atts is None:
                      print('  list_vnic_attachments err:', e)
                      continue
                  for a in atts:
                      v, e1 = safe(net.get_vnic, a.vnic_id)
                      if v is None:
                          print('  get_vnic err(%s): %s' % (a.vnic_id, e1))
                          continue
                      print('  VNIC %s (nic_index=%s)' % (v.id, getattr(a, 'nic_index', '?')))
                      pips, e2 = safe(all_pages, net.list_private_ips, vnic_id=v.id)
                      if pips is None:
                          print('   list_private_ips err:', e2)
                          continue
                      for p in pips:
                          print('   priv %s primary=%s ip=%s' % (p.id, p.is_primary, p.ip_address))
                          if p.is_primary:
                              pb, e3 = safe(pub_by_priv, p.id)
                              print('    pub-by-priv ->', fmt(pb) if pb else e3)
              for ip in ('168.107.86.163', '161.118.248.18'):
                  pb, e4 = safe(pub_by_addr, ip)
                  print('LOOKUP %s ->' % ip, fmt(pb) if pb else e4)

          if ACTION == 'apply':
              if not OLD_IP:
                  print('ERROR: old_ip required')
                  sys.exit(1)
              pb, e = safe(pub_by_addr, OLD_IP)
              if pb is None:
                  print('ERROR: lookup failed:', e)
                  sys.exit(1)
              print('TARGET:', fmt(pb))
              if pb.lifetime != 'EPHEMERAL':
                  print('ABORT: target lifetime is %s, not EPHEMERAL' % pb.lifetime)
                  sys.exit(1)
              if not pb.private_ip_id:
                  print('ABORT: no private ip on target')
                  sys.exit(1)
              priv_id = pb.private_ip_id
              comp_id = pb.compartment_id
              old_id = pb.id
              new = None
              for att in range(1, 4):
                  try:
                      new = net.create_public_ip(oci.core.models.CreatePublicIpDetails(
                          compartment_id=comp_id, lifetime='RESERVED',
                          display_name=R_NAME)).data
                      break
                  except oci.exceptions.ServiceError as e2:
                      print('create attempt %d err: %s %s' % (att, e2.status, e2.message))
                      time.sleep(5)
              if new is None:
                  print('ERROR: reserved ip create failed')
                  sys.exit(1)
              print('PRE-CREATED reserved:', new.ip_address, new.id, new.lifecycle_state)
              print('STEP: deleting ephemeral %s (id=%s)' % (OLD_IP, old_id))
              d, ed = safe(net.delete_public_ip, old_id)
              if ed:
                  print('  delete note:', ed)
              freed = False
              for i in range(40):
                  p2, err2 = safe(pub_by_priv, priv_id)
                  if p2 is None:
                      freed = True
                      print('STEP: private ip freed (no public ip)')
                      break
                  st = getattr(p2, 'lifecycle_state', '?')
                  print('  wait free: %s' % st)
                  if st in ('TERMINATED', 'TERMINATING'):
                      time.sleep(3)
                      continue
                  time.sleep(3)
              if not freed:
                  print('WARN: private ip not confirmed free, assigning anyway')
              assigned = None
              for att in range(1, 6):
                  try:
                      net.update_public_ip(new.id, oci.core.models.UpdatePublicIpDetails(private_ip_id=priv_id))
                  except oci.exceptions.ServiceError as e4:
                      print('assign attempt %d err: %s %s' % (att, e4.status, e4.message))
                  ok = False
                  for i in range(30):
                      cur, e5 = safe(net.get_public_ip, new.id)
                      if cur is None:
                          print('  poll err:', e5)
                          time.sleep(3)
                          continue
                      print('  poll state: %s priv=%s' % (cur.lifecycle_state, cur.private_ip_id))
                      if cur.lifecycle_state == 'ASSIGNED' and cur.private_ip_id == priv_id:
                          assigned = cur
                          ok = True
                          break
                      time.sleep(3)
                  if ok:
                      break
                  time.sleep(5)
              if assigned is None:
                  print('ERROR: assignment did not reach ASSIGNED')
                  sys.exit(1)
              print('NEW_IP: %s' % assigned.ip_address)
              print('NEW_PUBLIC_IP_OCID: %s' % assigned.id)
              print('NEW_STATE: %s lifetime=%s' % (assigned.lifecycle_state, assigned.lifetime))
              print('RESULT: converted %s -> %s' % (OLD_IP, assigned.ip_address))
          PYEOF

      - name: Publish result
        if: always()
        run: |
          mkdir -p _automation
          {
            echo "# reserve-ip result"
            echo
            echo "- action: ${{ inputs.action }}"
            echo "- old_ip: ${{ inputs.old_ip }}"
            echo "- utc: $(date -u +%FT%TZ)"
            echo
            echo '```'
            cat /tmp/result.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } > _automation/reserve-ip-result.md
          git config user.name wb-automation
          git config user.email wb-automation@users.noreply.github.com
          git add _automation/reserve-ip-result.md
          git commit -m "reserve-ip result: ${{ inputs.action }} ${{ inputs.old_ip }}" || true
          git push || true
