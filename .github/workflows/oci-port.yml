name: OCI Port Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'open = 放行端口, close = 关闭端口'
        type: choice
        options: [open, close]
        required: true
      ports:
        description: '逗号分隔端口号，如 80,443'
        required: true
        default: '80,443'
      proto:
        description: '协议：tcp / udp / both'
        type: choice
        options: [tcp, udp, both]
        default: tcp
        required: true

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install OCI CLI
        run: pip install oci-cli
      - name: Write OCI config & key
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p $HOME/.oci
          printf '%s\n' "$OCI_KEY" > $HOME/oci_key.pem
          chmod 600 $HOME/oci_key.pem
          printf '%s\n' "$OCI_CONFIG" > $HOME/.oci/config
      - name: Manage security list ports
        env:
          ACTION: ${{ inputs.action }}
          PORTS: ${{ inputs.ports }}
          PROTO: ${{ inputs.proto }}
        run: |
          set -e
          python3 - <<'PYEOF'
          import json, subprocess, os
          action = os.environ['ACTION']
          ports  = os.environ['PORTS']
          proto  = (os.environ.get('PROTO') or 'tcp').strip().lower()
          SL = 'ocid1.securitylist.oc1.ap-singapore-1.aaaaaaaaozhglrhji2a4wcssgditmqp7jvhbjzcexrqhufp73td3z5rympmq'

          want = set(int(p) for p in ports.replace(' ', '').split(',') if p)
          want_tcp = want if proto in ('tcp', 'both') else set()
          want_udp = want if proto in ('udp', 'both') else set()

          cur = json.loads(subprocess.check_output([
              'oci', 'network', 'security-list', 'get',
              '--security-list-id', SL, '--output', 'json']))['data']
          rules = cur['ingress-security-rules']

          tcp_ports, udp_ports, keep = set(), set(), []
          for r in rules:
              p = str(r.get('protocol'))
              if p == '6':
                  d = (r.get('tcp-options') or {}).get('destination-port-range')
                  if d and d['min'] == d['max']:
                      tcp_ports.add(d['min'])
                      continue
              elif p == '17':
                  d = (r.get('udp-options') or {}).get('destination-port-range')
                  if d and d['min'] == d['max']:
                      udp_ports.add(d['min'])
                      continue
              keep.append(r)   # 非单端口规则原样保留

          if action == 'open':
              tcp_ports |= want_tcp
              udp_ports |= want_udp
          else:
              tcp_ports -= want_tcp
              udp_ports -= want_udp

          new_rules = list(keep)
          for p in sorted(tcp_ports):
              new_rules.append({
                  'source': '0.0.0.0/0', 'source-type': 'CIDR_BLOCK',
                  'protocol': '6', 'is-stateless': False,
                  'tcp-options': {'destination-port-range': {'min': p, 'max': p}, 'source-port-range': None},
              })
          for p in sorted(udp_ports):
              new_rules.append({
                  'source': '0.0.0.0/0', 'source-type': 'CIDR_BLOCK',
                  'protocol': '17', 'is-stateless': False,
                  'udp-options': {'destination-port-range': {'min': p, 'max': p}, 'source-port-range': None},
              })

          subprocess.run(['oci', 'network', 'security-list', 'update',
                          '--security-list-id', SL,
                          '--ingress-security-rules', json.dumps(new_rules), '--force'], check=True)
          print(f'[{action}/{proto}] 目标 {sorted(want)}')
          print(f'  TCP 单端口: {sorted(tcp_ports)}')
          print(f'  UDP 单端口: {sorted(udp_ports)}')
          PYEOF
      - name: Verify
        run: |
          oci network security-list get --security-list-id "ocid1.securitylist.oc1.ap-singapore-1.aaaaaaaaozhglrhji2a4wcssgditmqp7jvhbjzcexrqhufp73td3z5rympmq" \
            --query 'data."ingress-security-rules"[].{proto:protocol,tcp:"tcp-options"."destination-port-range".min,udp:"udp-options"."destination-port-range".min}' --output json
