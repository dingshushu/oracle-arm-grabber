name: OCI Info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install OCI CLI
        run: pip install oci-cli
      - name: Write OCI config & key
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p $HOME/.oci
          printf '%s\n' "$OCI_KEY" > $HOME/oci_key.pem
          chmod 600 $HOME/oci_key.pem
          printf '%s\n' "$OCI_CONFIG" > $HOME/.oci/config
      - name: Query tenancy / user / region
        run: |
          TENANCY=$(awk -F= '/^tenancy=/{print $2}' $HOME/.oci/config | tr -d ' ')
          echo "===== TENANCY ====="
          oci iam tenancy get --tenancy-id "$TENANCY" --query 'data.{name:name,id:id,home_region:"home-region-key"}' --output json
          echo "===== DOMAINS ====="
          oci iam domain list --compartment-id "$TENANCY" --query 'data[].{name:name,type:"domain-type",state:"lifecycle-state",url:url}' --output json
          echo "===== USERS (登录名) ====="
          oci iam user list --compartment-id "$TENANCY" --query 'data[].{name:name,email:email,state:"lifecycle-state"}' --output json
          echo "===== REGIONS ====="
          oci iam region-subscription list --tenancy-id "$TENANCY" --query 'data[].{"region-key":"region-key",status:status}' --output json
      - name: Query network / public IPs / security lists
        run: |
          set +e
          TENANCY=$(awk -F= '/^tenancy=/{print $2}' $HOME/.oci/config | tr -d ' ')
          {
            echo "===== PUBLIC IPs ====="
            oci network public-ip list --compartment-id "$TENANCY" --scope REGION --all --output json
            echo "===== VCNs ====="
            VCN=$(oci network vcn list --compartment-id "$TENANCY" --query 'data[0].id' --raw-output 2>/dev/null)
            echo "VCN=$VCN"
            echo "===== SUBNETS ====="
            oci network subnet list --compartment-id "$TENANCY" --vcn-id "$VCN" --output json
            echo "===== SECURITY LISTS ====="
            SLs=$(oci network subnet list --compartment-id "$TENANCY" --vcn-id "$VCN" --query 'data[]."security-list-ids"[]' --output json 2>/dev/null)
            echo "$SLs" | python3 -c "import json,sys; [print(x) for x in json.load(sys.stdin)]" > /tmp/sls.txt
            while read -r SL; do
              [ -z "$SL" ] && continue
              echo "--- SecurityList $SL ---"
              oci network security-list get --security-list-id "$SL" --output json
            done < /tmp/sls.txt
          } > result.txt 2>&1
          cat result.txt

      - name: Query instances (inventory, 2026-10-17 加)
        run: |
          set +e
          python3 - <<'PY'
          import oci, os
          cfg = oci.config.from_file(os.path.expanduser("~/.oci/config"))
          comp = cfg["tenancy"]
          comp_client = oci.identity.IdentityClient(cfg)
          print("===== COMPARTMENT IDS =====")
          for c in comp_client.list_compartments(comp).data:
              print(c.id, c.name, c.lifecycle_state)
          print("===== INSTANCES (all shapes/states) =====")
          ce = oci.core.ComputeClient(cfg)
          net = oci.core.VirtualNetworkClient(cfg)
          rows = ce.list_instances(comp).data
          print(f"total instances: {len(rows)}")
          for i in rows:
              print(f"--- {i.display_name} | {i.shape} | {i.lifecycle_state} | created={i.time_created} | id={i.id[-12:]}")
              try:
                  vnics = ce.list_vnic_attachments(comp, i.id).data
                  for va in vnics:
                      v = net.get_vnic(va.vnic_id).data
                      print(f"      vnic: private={v.private_ip} public={v.public_ip}")
              except Exception as e:
                  print("      vnic query failed:", e)
          PY
