name: Grab Oracle ARM

# 策略（2026-11-02 修订）：单轮深探测 900s，靠闸门收敛到 16 分钟一轮。
# 依据（2026-11-02 抓取 7 轮完整日志实测）：
#   1) OCI 对 compute instance launch 的限流窗口是 55~58s，与请求密度无关。
#      一次成功询价后紧接 3 次调用必 429，再等 ~55s 才恢复；一小时物理上限约 65 次。
#   2) 旧的 8 分钟/400s 轮次里，setup（pip install oci-cli ~39s）每小时重复 7.5 次，
#      白烧约 8% 时间；且 MAX_ATTEMPTS=25 常在时间预算耗尽前就被用光
#      （实测有一轮 345s 就跑完 25 次，剩 83s 空转）。
#   3) 改为 900s 长轮后：setup 摊薄到 4%，有效询价从 41 次/小时升到约 59 次/小时（+44%）。
# 触发源保持不变（GitHub cron */8 + cron-job.org job 8620957 的 [0,8,...,48] UTC），
# 由 MIN_GAP_SECONDS=900 把多余触发全部挡掉，自然收敛为 :00/:16/:32/:48 节奏，
# 因此不需要改 cron 表，也不需要动 cron-job.org。
# 脚本侧同步：去掉 3 次 5s 空撞式快速重试（首次 429 即等满窗口）+ 睡前预判防超时。
on:
  schedule:
    - cron: '*/8 * * * *'          # 每 8 分钟；与 cron-job.org job 8620957 的 [0,8,...,48] 对齐
  workflow_dispatch:         # 允许手动点一下立即运行（测试用）
    inputs:
      strict_skip:
        description: '严格模式：容量预检明确无货时直接跳过本轮'
        type: boolean
        required: false
        default: false

# 同一时间只跑一个实例，避免重叠造成重复 API 调用、被限流
concurrency:
  group: grab-arm
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-24.04   # 固定 LTS，避免 ubuntu-latest 于 2026-10-19 迁移 Ubuntu 26 引发意外
    timeout-minutes: 20     # 单轮 900s 探测 + setup ~43s ≈ 945s，20 分钟留足余量防截断
    permissions:
      issues: write
      actions: read          # 节流闸门需查询本 workflow 的历史运行
    env:
      # 以下为非敏感固定参数（主区域 ap-singapore-1）
      COMPARTMENT_ID: "ocid1.tenancy.oc1..aaaaaaaaii4jwevwldqla6tyb2wy3avachyzlhuoizmvg4wrjczdpfe5aznq"
      AVAILABILITY_DOMAIN: "bThc:AP-SINGAPORE-1-AD-1"
      SUBNET_ID: "ocid1.subnet.oc1.ap-singapore-1.aaaaaaaa2dnalbqseumn75ga3klzgpgbyk7jgh6r6riidtehul22yhauxtna"
      IMAGE_ID: "ocid1.image.oc1.ap-singapore-1.aaaaaaaaw75ef2chh5goomskvdznqz36cadczqelqvndbqcozc5icyig57za"
      # 节流阈值(秒)：两个触发源（GitHub cron */8 + cron-job.org job 8620957
      # 的 [0,8,...,48] UTC）对齐点火，靠此门控去重——距上次**真正执行**的
      # 一轮不足该值就直接退出。
      # 2026-11-02：470 → 900。单轮时长加到 ~945s 后，8 分钟粒度的触发点里
      # 只有「隔 16 分钟」的那个能通过闸门（隔 8 分钟时上一轮还在跑），
      # 于是自动收敛为 :00/:16/:32/:48 的 16 分钟节奏，cron 表无需改动。
      MIN_GAP_SECONDS: "900"
    steps:
      - name: Throttle gate（节流闸门）
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REPO="${{ github.repository }}"
          now=$(date +%s)
          # 取本 workflow 最近一次运行（排除当前这次）。
          # 注意：必须统计所有触发事件（schedule + workflow_dispatch）——
          # 旧版只统计 workflow_dispatch，GitHub cron 与 cron-job.org 同分钟
          # 各跑一轮时门控失效（schedule 的 run 不计入窗口）。
          #
          # 2026-10-29 修复「自锁误伤」：旧逻辑把**被闸门跳过的 run**也计入窗口，
          # 一次跳过会挡住下一次（实测执行率被压到 62%，且整点 56→00 只隔 4 分钟
          # 必被砍一轮）。现在只把「真正在跑/真跑过」的 run 视为占位：
          #   - in_progress / queued            → 一定在跑，必须挡
          #   - completed 且耗时 > 60s          → 真执行过（闸门跳过的 run 仅 7~25s）
          api="https://api.github.com/repos/${REPO}/actions/workflows/grab-oracle-arm.yml/runs?per_page=15"
          last=$(curl -sS -m 20 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" "$api" \
                 | jq -r --argjson now "$now" --argjson gap "$MIN_GAP_SECONDS" \
                   --argjson cur "${{ github.run_id }}" '
                     [ .workflow_runs[]
                       | select(.id != $cur)
                       | select((($now - (.created_at|fromdateiso8601)) < $gap))
                       | select(
                           .status == "in_progress"
                           or .status == "queued"
                           or (.status == "completed"
                               and ((.updated_at|fromdateiso8601)
                                    - ((.run_started_at // .created_at)|fromdateiso8601)) > 60)
                         )
                     ]
                     | length' 2>/dev/null || echo 0)
          if [ "${last:-0}" -gt 0 ]; then
            echo "距上次运行不足 ${MIN_GAP_SECONDS}s，本轮跳过（等效 16 分钟节奏）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "距上次运行已超过 ${MIN_GAP_SECONDS}s，本轮正常执行。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Setup Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install OCI CLI (含 oci Python SDK，供容量预检使用)
        if: steps.gate.outputs.skip != 'true'
        run: pip install oci-cli

      - name: Write OCI config & key
        if: steps.gate.outputs.skip != 'true'
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p $HOME/.oci
          printf '%s\n' "$OCI_KEY" > $HOME/oci_key.pem
          chmod 600 $HOME/oci_key.pem
          printf '%s\n' "$OCI_CONFIG" > $HOME/.oci/config

      - name: Run grabber
        if: steps.gate.outputs.skip != 'true'
        id: grab
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
          SSH_KEY_PUB: ${{ secrets.SSH_KEY_PUB }}
          GH_TOKEN: ${{ github.token }}        # 阶梯 OCPU 状态机需读写本仓库 issue
          ADAPTIVE: "true"            # 自适应调速：被限速自动退避
          CAPACITY_PRECHECK: "true"   # 容量预检：每轮先查 Capacity Report
          MAX_ATTEMPTS: "35"          # 单轮尝试次数：900s ÷ 57s ≈ 16 次有效询价 + 429 余量（预检有货时自动 +5）
          TIME_BUDGET: "900"          # 单轮时间预算(秒)：16 分钟节奏内 setup 43s + 探测 900s
          MAX_THROTTLE_STREAK: "12"   # 限流容忍：900s 长轮内允许 12 次连续限流（补差式退避，不会空烧）
          STEP_OCPU_ENABLED: "true"   # 阶梯策略：连续 24 轮无货降 1 OCPU 捡漏，中奖即扩容回 2
          STRICT_SKIP: ${{ github.event.inputs.strict_skip || 'false' }}   # 默认不跳过（防误杀）；手动可勾选严格模式
        run: bash grab_arm_action.sh

      - name: Report IP to Issue
        if: steps.grab.outputs.arm_ip != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IP="${{ steps.grab.outputs.arm_ip }}"
          REPO="${{ github.repository }}"
          BODY="Public IP: $IP"$'\n'"登录: ssh -i oracle_arm_id_rsa ubuntu@$IP"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "ARM 实例已抢到 in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --title "🎯 ARM 实例已抢到 — IP: $IP" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🎯 ARM 实例已抢到 — IP: $IP" --body "$BODY"
          fi
