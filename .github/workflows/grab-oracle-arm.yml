name: Grab Oracle ARM

# 策略（2026-10-17 起）：每 15 分钟一轮，但单轮跑得更久、探测更密。
# 依据：A1 放货窗口常是几十秒~几分钟的瞬时窗口；原先"每 5 分钟 × 6 次"在持续限流下
# 每轮只跑 112s 就因连续 3 次限流提前收工，对瞬时窗口几乎无覆盖能力。
# 现在 = 低频触发（降风控压力）+ 单轮深探测（MAX_ATTEMPTS 10 / TIME_BUDGET 320s /
# 限流容忍 6 次），job 超时同步放宽到 9 分钟。
on:
  schedule:
    - cron: '4,19,34,49 * * * *'   # 每 15 分钟（偏移避开整点；避开 :00/:30 的高峰）
  workflow_dispatch:         # 允许手动点一下立即运行（测试用）
    inputs:
      strict_skip:
        description: '严格模式：容量预检明确无货时直接跳过本轮'
        type: boolean
        required: false
        default: false

# 同一时间只跑一个实例，避免重叠造成重复 API 调用、被限流
concurrency:
  group: grab-arm
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-24.04   # 固定 LTS，避免 ubuntu-latest 于 2026-10-19 迁移 Ubuntu 26 引发意外
    timeout-minutes: 9      # 单轮最长约 320s + setup ~90s，留足余量（原 6 分钟会截断深探测轮次）
    permissions:
      issues: write
      actions: read          # 节流闸门需查询本 workflow 的历史运行
    env:
      # 以下为非敏感固定参数（主区域 ap-singapore-1）
      COMPARTMENT_ID: "ocid1.tenancy.oc1..aaaaaaaaii4jwevwldqla6tyb2wy3avachyzlhuoizmvg4wrjczdpfe5aznq"
      AVAILABILITY_DOMAIN: "bThc:AP-SINGAPORE-1-AD-1"
      SUBNET_ID: "ocid1.subnet.oc1.ap-singapore-1.aaaaaaaa2dnalbqseumn75ga3klzgpgbyk7jgh6r6riidtehul22yhauxtna"
      IMAGE_ID: "ocid1.image.oc1.ap-singapore-1.aaaaaaaaw75ef2chh5goomskvdznqz36cadczqelqvndbqcozc5icyig57za"
      # 节流阈值(秒)：实际触发源 cron-job.org 固定每 5 分钟打一次 workflow_dispatch，
      # 无法从 GitHub 侧改它的间隔，故在此做门控 —— 距上次放行不足该值就直接退出。
      # 840s = 14 分钟，配合 5 分钟节奏自然收敛为「每 15 分钟真正跑一轮」。
      MIN_GAP_SECONDS: "840"
    steps:
      - name: Throttle gate（节流闸门）
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REPO="${{ github.repository }}"
          now=$(date +%s)
          # 取本 workflow 最近一次成功进入执行体的运行（排除当前这次与排队中的）
          api="https://api.github.com/repos/${REPO}/actions/workflows/grab-oracle-arm.yml/runs?per_page=15"
          last=$(curl -sS -m 20 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" "$api" \
                 | jq -r --argjson now "$now" --argjson gap "$MIN_GAP_SECONDS" \
                   --argjson cur "${{ github.run_id }}" '
                     [ .workflow_runs[]
                       | select(.id != $cur)
                       | select(.event == "workflow_dispatch")
                       | select(.status == "completed" or .status == "in_progress")
                     ]
                     | map(select((($now - (.created_at|fromdateiso8601)) < $gap)))
                     | length' 2>/dev/null || echo 0)
          if [ "${last:-0}" -gt 0 ]; then
            echo "距上次运行不足 ${MIN_GAP_SECONDS}s，本轮跳过（等效 15 分钟节奏）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "距上次运行已超过 ${MIN_GAP_SECONDS}s，本轮正常执行。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Setup Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install OCI CLI (含 oci Python SDK，供容量预检使用)
        if: steps.gate.outputs.skip != 'true'
        run: pip install oci-cli

      - name: Write OCI config & key
        if: steps.gate.outputs.skip != 'true'
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p $HOME/.oci
          printf '%s\n' "$OCI_KEY" > $HOME/oci_key.pem
          chmod 600 $HOME/oci_key.pem
          printf '%s\n' "$OCI_CONFIG" > $HOME/.oci/config

      - name: Run grabber
        if: steps.gate.outputs.skip != 'true'
        id: grab
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
          SSH_KEY_PUB: ${{ secrets.SSH_KEY_PUB }}
          ADAPTIVE: "true"            # 自适应调速：被限速自动退避
          CAPACITY_PRECHECK: "true"   # 容量预检：每轮先查 Capacity Report
          MAX_ATTEMPTS: "10"          # 单轮尝试次数（预检有货时自动加量到 15）
          TIME_BUDGET: "320"          # 单轮时间预算(秒)：15 分钟间隔下可放心跑更久
          MAX_THROTTLE_STREAK: "6"    # 限流容忍：原 3 次太早收工（实测每轮必撞 3 次），放宽到 6
          STRICT_SKIP: ${{ github.event.inputs.strict_skip || 'false' }}   # 默认不跳过（防误杀）；手动可勾选严格模式
        run: bash grab_arm_action.sh

      - name: Report IP to Issue
        if: steps.grab.outputs.arm_ip != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IP="${{ steps.grab.outputs.arm_ip }}"
          REPO="${{ github.repository }}"
          BODY="Public IP: $IP"$'\n'"登录: ssh -i oracle_arm_id_rsa ubuntu@$IP"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "ARM 实例已抢到 in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --title "🎯 ARM 实例已抢到 — IP: $IP" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "🎯 ARM 实例已抢到 — IP: $IP" --body "$BODY"
          fi
