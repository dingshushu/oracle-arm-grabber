name: Deploy Dispatch Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          GH_APP_PEM: ${{ secrets.GH_APP_PEM }}
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4"
          SCRIPT_NAME="oracle-arm-grabber-dispatch"
          WORKER_URL="https://oracle-arm-grabber-dispatch.dantion.workers.dev"

          echo "== 1) 获取 Account ID =="
          ACCOUNT_ID=$(curl -sS "$API/accounts" -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json
          d=json.load(sys.stdin)
          res=d.get('result') or []
          print(res[0].get('id','') if res else '')")
          if [ -z "$ACCOUNT_ID" ]; then
            echo "FAILED: 无法获取 account_id —— CF_TOKEN 无效或无账户权限"
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID"

          echo "== 2) 生成 metadata（4 变量 + 4 Secret）=="
          python3 - <<'PYEOF'
          import json, os
          pem = os.environ["GH_APP_PEM"].strip()
          meta = {
            "main_module": "worker.js",
            "bindings": [
              {"name": "GH_REPO",            "type": "plain_text", "text": "dingshushu/oracle-arm-grabber"},
              {"name": "GH_REF",             "type": "plain_text", "text": "main"},
              {"name": "GH_WORKFLOW",        "type": "plain_text", "text": "grab-oracle-arm.yml"},
              {"name": "GH_WORKFLOW_AMD",    "type": "plain_text", "text": "grab-amd.yml"},
              {"name": "GH_APP_ID",          "type": "secret_text", "text": "5268332"},
              {"name": "GH_INSTALLATION_ID", "type": "secret_text", "text": "170103729"},
              {"name": "GH_APP_PEM",         "type": "secret_text", "text": pem},
              {"name": "WORKER_SECRET",      "type": "secret_text", "text": "test123"},
            ],
          }
          with open("metadata.json", "w") as f:
              json.dump(meta, f)
          print("metadata OK, bindings =", len(meta["bindings"]))
          PYEOF

          echo "== 3) 上传并部署 =="
          cp cf-dispatch-worker.js worker.js
          HTTP=$(curl -sS -o cf_response.json -w "%{http_code}" -X PUT \
            "$API/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=<metadata.json;type=application/json" \
            -F "worker.js=@worker.js;type=application/javascript+module")
          echo "HTTP_CODE=$HTTP"
          echo "--- 完整响应体 ---"
          cat cf_response.json
          echo ""
          echo "--- 解析结果 ---"
          python3 -c "import sys,json
          d=json.load(open('cf_response.json'))
          print('success =', d.get('success'))
          if d.get('errors'): print('errors =', d['errors'])
          sys.exit(0 if d.get('success') else 1)" || { echo "DEPLOY_FAILED"; exit 1; }
          echo "DEPLOY_OK"

          echo "== 4) 核对 bindings =="
          curl -sS "$API/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json
          d=json.load(sys.stdin)
          bs=d.get('result',{}).get('bindings',[])
          for b in bs: print('  -', b.get('name'), '=', b.get('type'))
          names=[b.get('name') for b in bs]
          need=['GH_REPO','GH_REF','GH_WORKFLOW','GH_WORKFLOW_AMD','GH_APP_ID','GH_INSTALLATION_ID','GH_APP_PEM','WORKER_SECRET']
          miss=[n for n in need if n not in names]
          if miss:
              print('MISSING:', miss); sys.exit(1)
          print('ALL_8_BINDINGS_OK')" || { echo "BINDINGS_CHECK_FAILED"; exit 1; }

          echo "== 5) 功能性测试：直连 Worker（target=amd）=="
          FUNC=$(curl -sS --max-time 30 "$WORKER_URL/?secret=test123&target=amd")
          echo "worker响应: $FUNC"
          if echo "$FUNC" | grep -q "grab-amd.yml"; then
            echo "FUNC_OK: 新 Worker 已生效（target=amd 正确路由到 grab-amd.yml）"
          else
            echo "FUNC_FAIL: 响应中未出现 grab-amd.yml —— 线上可能仍是旧 Worker"
            exit 1
          fi
